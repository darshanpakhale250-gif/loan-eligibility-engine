services:
  # ─── 1. Frontend (Static UI + API Reverse Proxy) ───────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - loan_net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── 2. Backend (FastAPI, Ingestion, Crawl4AI Crawler) ─────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    init: true
    shm_size: "1gb"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - N8N_WEBHOOK_BASE_INTERNAL=${N8N_WEBHOOK_BASE_INTERNAL:-http://n8n:5678/webhook}
      - STORAGE_MODE=${STORAGE_MODE:-local}
      - UPLOAD_DIR=/data/uploads
      - CRAWL_DIR=/data/crawl
      - MAX_PAGES=${MAX_PAGES:-5}
      - MAX_DEPTH=${MAX_DEPTH:-1}
      - PAGE_TIMEOUT_MS=${PAGE_TIMEOUT_MS:-30000}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - uploads:/data/uploads
      - crawl_data:/data/crawl
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - loan_net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── 3. n8n (Workflow Automation) ──────────────────────────────────────────
  n8n:
    image: n8nio/n8n:1.76.1
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - WEBHOOK_URL=http://localhost:5678/
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_INSTANCE_OWNER_MANAGED_BY_ENV=true
      - N8N_DEFAULT_USER_EMAIL=admin@admin.com
      - N8N_DEFAULT_USER_PASSWORD=Admin123456!
      - N8N_DEFAULT_USER_FIRST_NAME=Admin
      - N8N_DEFAULT_USER_LAST_NAME=Admin
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LLM_MAX_PAIRS=${LLM_MAX_PAIRS:-100}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - SES_FROM_EMAIL=${SES_FROM_EMAIL:-}
      - TEST_EMAIL_BASE=${TEST_EMAIL_BASE:-}
      - TEST_VERIFIED_EMAILS=${TEST_VERIFIED_EMAILS:-}
      - MAX_EMAILS_PER_RUN=${MAX_EMAILS_PER_RUN:-3}
      - EMAIL_DRY_RUN=${EMAIL_DRY_RUN:-true}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/n8n:ro
    entrypoint: ["/bin/sh", "/n8n/bootstrap.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - loan_net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── 4. Postgres (Database) ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - loan_net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── 5. pgAdmin 4 (Database UI & Visual ERD) ──────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - loan_net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  loan_net:
    driver: bridge

volumes:
  pgdata:
  n8n_data:
  uploads:
  crawl_data:
