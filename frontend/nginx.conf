server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large CSV uploads (up to 50MB)
    client_max_body_size 50M;

    # Redirect /api → /api/ to avoid 301 confusion
    location = /api {
        return 301 /api/;
    }

    # Proxy /api/ requests to the internal FastAPI backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable proxy buffering for streaming file uploads
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
    }

    # Proxy Swagger docs to backend
    location ~ ^/(docs|openapi\.json) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Block access to internal endpoints from outside
    location /internal/ {
        return 403 "Forbidden\n";
    }

    # Static assets
    location / {
        try_files $uri $uri/ /index.html;
    }
}
